<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Painting Colour Assistant app icon, master artwork (used for 64 px and larger).
       Left half of the drop: the picture as painted. Right half: the same reduced to colour levels.
       Thirds grid and crossing ring: composition overlay. Brush: mixing recipes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B2E36"/>
      <stop offset="1" stop-color="#15161A"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <clipPath id="drop">
      <path id="drop-shape" d="M512,161 C468,236 277,420 277,598 A235,235 0 0 0 747,598 C747,420 556,236 512,161 Z"/>
    </clipPath>
    <clipPath id="left">
      <rect x="250" y="140" width="262" height="720"/>
    </clipPath>
    <linearGradient id="paint" x1="0" y1="161" x2="0" y2="833" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8312B"/>
      <stop offset="0.28" stop-color="#D2502C"/>
      <stop offset="0.50" stop-color="#DDA24C"/>
      <stop offset="0.66" stop-color="#C66A3A"/>
      <stop offset="0.80" stop-color="#34509E"/>
      <stop offset="1" stop-color="#1A2C6A"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="560" x2="0" y2="833" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22408E" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#22408E" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#22408E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#16265E" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="gloss" x1="277" y1="0" x2="747" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="-13" x2="0" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8C929C"/>
      <stop offset="0.4" stop-color="#ECEFF4"/>
      <stop offset="1" stop-color="#6E747E"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="-11" x2="0" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A5F6B"/>
      <stop offset="0.35" stop-color="#2E313A"/>
      <stop offset="1" stop-color="#17181D"/>
    </linearGradient>
    <linearGradient id="bristles" x1="0" y1="-13" x2="0" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A06A3A"/>
      <stop offset="0.45" stop-color="#6B4122"/>
      <stop offset="1" stop-color="#3E2512"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background tile with a faint rim -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g clip-path="url(#squircle)">
    <!-- Rule-of-thirds grid -->
    <g stroke="#B08A55" stroke-opacity="0.55" stroke-width="7">
      <line x1="374.7" y1="100" x2="374.7" y2="924"/>
      <line x1="649.3" y1="100" x2="649.3" y2="924"/>
      <line x1="100" y1="374.7" x2="924" y2="374.7"/>
      <line x1="100" y1="649.3" x2="924" y2="649.3"/>
    </g>

    <!-- Drop shadow -->
    <path d="M512,175 C468,250 277,434 277,612 A235,235 0 0 0 747,612 C747,434 556,250 512,175 Z"
          fill="#000" fill-opacity="0.55" filter="url(#shadow)"/>

    <!-- Left half: painted, swirling mix of crimson, gold and cobalt -->
    <g clip-path="url(#drop)">
      <g clip-path="url(#left)">
        <rect x="250" y="140" width="262" height="720" fill="url(#paint)"/>
        <g fill="none" filter="url(#soft)" opacity="0.68">
          <use href="#drop-shape" stroke="#E2A852" stroke-width="48.4" transform="translate(560,680) scale(0.95) translate(-560,-680)"/>
          <use href="#drop-shape" stroke="#C0352B" stroke-width="50.0" transform="translate(560,680) scale(0.8) translate(-560,-680)"/>
          <use href="#drop-shape" stroke="#E8B862" stroke-width="73.8" transform="translate(560,680) scale(0.65) translate(-560,-680)"/>
          <use href="#drop-shape" stroke="#C44A2D" stroke-width="76.0" transform="translate(560,680) scale(0.5) translate(-560,-680)"/>
          <use href="#drop-shape" stroke="#DC9642" stroke-width="122.2" transform="translate(560,680) scale(0.36) translate(-560,-680)"/>
          <use href="#drop-shape" stroke="#B9392E" stroke-width="181.8" transform="translate(560,680) scale(0.22) translate(-560,-680)"/>
        </g>
        <rect x="250" y="560" width="262" height="300" fill="url(#deep)"/>
      </g>

      <!-- Right half: the same picture reduced to six colour levels -->
      <rect x="512" y="140" width="250" height="133" fill="#E5B963"/>
      <rect x="512" y="273" width="250" height="112" fill="#D9A25F"/>
      <rect x="512" y="385" width="250" height="112" fill="#C5846A"/>
      <rect x="512" y="497" width="250" height="112" fill="#5A76B2"/>
      <rect x="512" y="609" width="250" height="112" fill="#2D56A2"/>
      <rect x="512" y="721" width="250" height="140" fill="#1B3370"/>

      <!-- Divider, gloss and inner rim -->
      <rect x="509" y="140" width="6" height="720" fill="#0E0F13" fill-opacity="0.45"/>
      <rect x="250" y="140" width="520" height="720" fill="url(#gloss)"/>
      <use href="#drop-shape" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="22"/>
    </g>
    <use href="#drop-shape" fill="none" stroke="#F3E7D3" stroke-opacity="0.55" stroke-width="5"/>

    <!-- Thirds crossing marker at the tip -->
    <g stroke="#E2C08A" stroke-opacity="0.9" stroke-width="5" fill="none">
      <circle cx="512" cy="226" r="68"/>
      <line x1="392" y1="226" x2="438" y2="226"/>
      <line x1="586" y1="226" x2="632" y2="226"/>
      <line x1="512" y1="112" x2="512" y2="152"/>
    </g>

    <!-- Brush touching the drop -->
    <g transform="translate(524,226) rotate(-40)">
      <path d="M106,-11 L292,-7 Q300,0 292,7 L106,11 Z" fill="url(#handle)"/>
      <line x1="112" y1="-6" x2="288" y2="-3.5" stroke="#8D93A0" stroke-opacity="0.6" stroke-width="3"/>
      <rect x="70" y="-13" width="38" height="26" rx="3" fill="url(#ferrule)"/>
      <path d="M0,0 C14,-7 38,-15 72,-13 L72,13 C38,15 14,7 0,0 Z" fill="url(#bristles)"/>
    </g>
  </g>

  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
</svg>
