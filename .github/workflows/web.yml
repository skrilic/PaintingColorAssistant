name: Web app

# Builds the web version (WebAssembly, installable as an app) and publishes it on
# GitHub Pages. Runs with every release tag (v*), next to release.yml, and from
# "Run workflow" on the Actions tab to publish the current branch straight away.
# Repository settings -> Pages -> Source must be "GitHub Actions".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: web

      - name: Build
        run: ./web/build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/target/web

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
