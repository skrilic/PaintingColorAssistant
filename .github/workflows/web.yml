name: Website and web app

# Builds the website (site/build.py: Home, Changelog, Privacy policy) with the web app
# (WebAssembly, installable) under app/, and publishes both on GitHub Pages.
# release.yml runs this after publishing a release, so the download buttons point at the
# new files; "Run workflow" on the Actions tab publishes the current branch straight away.
# Repository settings -> Pages -> Source must be "GitHub Actions"; for runs from a release
# tag, the github-pages environment must allow tags v*.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: web

      - name: Build web app
        run: ./web/build.sh

      - name: Build website
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 site/build.py --out _site --app app/target/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
