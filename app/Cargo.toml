[package]
name = "painting_color_assistant"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
macroquad = "0.4"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Embeds the app icon and version info in the Windows .exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[patch.crates-io]
miniquad = { path = "vendor/miniquad" }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
