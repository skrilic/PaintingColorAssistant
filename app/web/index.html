<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>PaletteCraft</title>
    <meta name="description" content="Value and colour studies, composition overlays and paint mixing recipes from a reference picture.">
    <meta name="theme-color" content="#25262b">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PaletteCraft">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1b1c20;
        }
        canvas {
            display: block;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            outline: none;
            touch-action: none;
        }
        /* Inputs laid over the app's text fields (see palettecraft.js); visible only while typing. */
        .pc-field {
            position: fixed;
            display: none;
            box-sizing: border-box;
            margin: 0;
            padding: 0 8px;
            opacity: 0;
            border: 1px solid #ed9e45;
            border-radius: 4px;
            outline: none;
            background: #1b1c20;
            color: #ebebf0;
            /* 16px or more: iOS zooms the page into smaller inputs */
            font: 16px system-ui, sans-serif;
        }
        .pc-field:focus {
            opacity: 1;
        }
        /* Laid over "Open picture..." (see palettecraft.js): a tap on it opens the file chooser. */
        .pc-pick {
            position: fixed;
            display: none;
            cursor: pointer;
            border-radius: 5px;
            -webkit-tap-highlight-color: transparent;
        }
        /* The app no longer sees the mouse over the button, so the label lightens it the way
           the app's hover does (PANEL2 to PANEL3). Only with a mouse: a touch leaves :hover on. */
        @media (hover: hover) {
            .pc-pick:hover {
                background: rgba(255, 255, 255, 0.065);
            }
        }
        .pc-file {
            position: fixed;
            left: 0;
            top: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        /* Asks for a tap when the browser needs one to open a file chooser or save a file. */
        .pc-sheet {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
        }
        .pc-sheet > div {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(420px, 100% - 24px);
            margin-bottom: 24px;
        }
        .pc-sheet button {
            padding: 14px;
            border: 1px solid #4d4f59;
            border-radius: 10px;
            background: #2f3037;
            color: #ebebf0;
            font: 17px system-ui, sans-serif;
        }
        .pc-sheet button.pc-go {
            border-color: #ed9e45;
            background: #6b4d2b;
            color: #ffdba8;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c8c8d0;
            font: 16px system-ui, sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="loading">Loading PaletteCraft&hellip;</div>
    <script src="gl.js"></script>
    <script src="palettecraft.js"></script>
    <script>
        load("palettecraft.wasm");
        // Installable, and works without a network connection once opened (sw.js).
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
        }
    </script>
</body>
</html>
