<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Painting Colour Assistant</title>
    <link rel="icon" type="image/png" href="icon-64.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1b1c20;
        }
        canvas {
            display: block;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            outline: none;
            touch-action: none;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c8c8d0;
            font: 16px system-ui, sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="loading">Loading Painting Colour Assistant&hellip;</div>
    <script src="gl.js"></script>
    <script src="pca.js"></script>
    <script>load("painting_color_assistant.wasm");</script>
</body>
</html>
